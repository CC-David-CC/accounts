[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webos-accounts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["webos-runtime==0.1.0", "argon2-cffi==25.1.0", "cryptography==46.0.7"]

[project.scripts]
webos-accounts-dev = "webos_accounts.dev:main"

[tool.setuptools.packages.find]
where = ["src"]
